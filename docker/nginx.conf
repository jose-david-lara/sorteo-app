server_tokens off;

# Compresión: el bundle JS pesa ~730 KB sin comprimir (~240 KB con gzip).
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirecciones relativas: evita que aparezca el puerto interno 8080 detrás de un proxy.
    absolute_redirect off;

    # La app es estática: el Excel se procesa en el navegador y nunca se sube al servidor.
    client_max_body_size 1k;

    # Cabeceras también para respuestas de error (405, 404) generadas a nivel server.
    include /etc/nginx/snippets/security-headers.conf;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Archivos con hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
