services:
  sorteo-arbitros:
    build: .
    image: camp/sorteo-arbitros:2.0.0
    container_name: sorteo-arbitros
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
